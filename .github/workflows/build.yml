# TuxAPE built, tested and packed for Linux: x64 and ARM64 (Raspberry Pi 4
# and 5), built on Ubuntu 24.04, which runs on 24.04 and later. Each build
# leaves its folder as an artifact, made by tools/package.cmake: the
# program, Qt, and the folders beside it, without ROMs.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64

    steps:
      - uses: actions/checkout@v5

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0 ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTUXAPE_UPDATE_DIST=OFF 2>&1 | tee configure.log; exit ${PIPESTATUS[0]}

      - name: Build
        run: cmake --build build --parallel 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 600 --parallel 4 2>&1 | tee ../test.log; exit ${PIPESTATUS[0]}

      - name: Pack
        run: |
          cmake -DPROGRAM=build/src/app/tuxape -DQT="$QT_ROOT_DIR" -DROOT="$GITHUB_WORKSPACE" \
                -DOUT="$GITHUB_WORKSPACE/TuxAPE" -DSTRIP=strip -P tools/package.cmake

      # What went wrong, as annotations: they can be read from outside the
      # web page, the logs cannot without an account.
      - name: Report
        if: failure()
        run: |
          for log in configure.log build.log test.log; do
            [ -f "$log" ] || continue
            { grep -E -i "error|failed|fatal|\*\*\*|not found|undefined" "$log" || true; } | { grep -v -i "warning" || true; } | head -40 | \
              while IFS= read -r line; do echo "::error title=$log::${line:0:900}"; done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: TuxAPE-${{ matrix.name }}
          path: TuxAPE
