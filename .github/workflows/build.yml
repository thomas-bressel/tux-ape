# TuxAPE built, tested and packed for each system it is given for:
# Windows 10/11 (x64, ARM64), macOS (one application for Apple's and
# Intel's processors), Linux (x64, ARM64; built on Ubuntu 24.04, which runs
# on 24.04 and later). Each build leaves its folder as an artifact, made by
# tools/package.cmake: the program, Qt, and the folders beside it, without
# ROMs.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
          - name: windows-x86_64
            runner: windows-2025
            qt-host: windows
            qt-arch: win64_msvc2022_64
            msvc-arch: amd64
            triplet: x64-windows-static-md
          - name: windows-arm64
            runner: windows-11-arm
            qt-host: windows_arm64
            qt-arch: win64_msvc2022_arm64
            msvc-arch: arm64
            triplet: arm64-windows-static-md
          - name: macos-universal
            runner: macos-15
            qt-host: mac
            qt-arch: clang_64
            triplet: universal-osx

    steps:
      - uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev zlib1g-dev libgl-dev libegl-dev libxkbcommon-dev libxcb-cursor0 ninja-build

      - name: Compiler (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Libraries (Windows, Mac)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ -z "$VCPKG_INSTALLATION_ROOT" ] || [ ! -d "$VCPKG_INSTALLATION_ROOT" ]; then
            git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics || "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
            VCPKG_INSTALLATION_ROOT="$RUNNER_TEMP/vcpkg"
          fi
          echo "VCPKG=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install sdl2 zlib --triplet ${{ matrix.triplet }} \
            --overlay-triplets="$GITHUB_WORKSPACE/tools/vcpkg-triplets"

      - name: Configure
        shell: bash
        run: |
          options=(-DCMAKE_BUILD_TYPE=Release -DTUXAPE_UPDATE_DIST=OFF)
          if [ "$RUNNER_OS" != "Linux" ]; then
            options+=(-DCMAKE_TOOLCHAIN_FILE="$VCPKG/scripts/buildsystems/vcpkg.cmake"
                      -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
                      -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/tools/vcpkg-triplets")
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            options+=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          fi
          cmake -S . -B build -G Ninja "${options[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 600 --parallel 4

      - name: Pack
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) program=build/src/app/tuxape.exe ;;
            macOS)   program=build/src/app/tuxape.app ;;
            *)       program=build/src/app/tuxape ;;
          esac
          cmake -DPROGRAM="$program" -DQT="$QT_ROOT_DIR" -DROOT="$GITHUB_WORKSPACE" \
                -DOUT="$GITHUB_WORKSPACE/TuxAPE" -DSTRIP=strip -P tools/package.cmake

      - uses: actions/upload-artifact@v4
        with:
          name: TuxAPE-${{ matrix.name }}
          path: TuxAPE
